services:
  - type: web
    name: constituency-sms-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: constituency-sms-db
          property: connectionString
      - key: TALKSASA_SENDER_ID
        value: "TALK-SASA" # Replace with your custom sender ID if you have a live one
      - key: TALKSASA_API_KEY
        sync: false        # This allows you to type your secret API key safely inside the Render Dashboard UI
      - key: SMS_COST_PER_SEGMENT
        value: "0.80"
      - key: BILLING_CURRENCY
        value: KES
      - key: SEED_SAMPLE_DATA
        value: "false"     # 🎯 FIXED: Forced to false so it leaves your production database alone

databases:
  - name: constituency-sms-db
    engine: mysql          # 🎯 FIXED: Configured as a MySQL instance to match your MariaDB project structure
    plan: free